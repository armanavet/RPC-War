<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D2126" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icon-180.png">
<title>Player — Oddboards</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/leaderboard.css">
<link rel="stylesheet" href="../css/player.css">
<link rel="stylesheet" href="../css/ads.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="../">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--surface-2)" stroke="var(--line-2)" stroke-width="1.3"/>
        <circle cx="9.5" cy="10" r="4.6" fill="var(--accent)"/>
        <circle cx="15" cy="14.5" r="4.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.3"/>
      </svg>
      <span class="brand__name">Oddboards</span>
    </a>
    <nav class="nav" aria-label="Main"><a href="../">Games</a><a href="../wargames/">War games</a><a href="../leaderboard/">Leaderboard</a></nav>
    <div class="topbar__end">
      <button class="chipbtn" id="navProfile">
        <span class="avatar avatar--sm" id="navAvatar"></span>
        <span id="navName">Sign in</span>
      </button>
    </div>
  </div>
</header>

<main class="stack">
  <div class="wrap">

    <section class="me panel" id="who">
      <span class="avatar avatar--lg" id="pAvatar">?</span>
      <div class="me__who">
        <div class="me__name display" id="pName">…</div>
        <div class="me__line muted" id="pHandle"></div>
      </div>
      <dl class="pstats" id="pStats"></dl>
    </section>

    <h2 class="h-games display">Recent games</h2>
    <div class="panel">
      <table class="lb hist" id="histTable">
        <thead>
          <tr>
            <th>Result</th>
            <th class="lb__wide">Game</th>
            <th>Opponent</th>
            <th class="lb__num">Rating</th>
            <th class="lb__wide">How it ended</th>
            <th class="lb__wide lb__num">When</th>
          </tr>
        </thead>
        <tbody id="histBody"></tbody>
      </table>
      <p class="lb__empty" id="histEmpty" style="display:none">No finished games yet.</p>
    </div>

    <div class="adslot" data-ad="player"></div>

  </div>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <a href="../">Oddboards</a>
    <span class="muted">Only ranked games move rating.</span>
      <a href="../privacy/">Privacy</a>
  </div>
</footer>

<script type="module" src="../js/site/player.js"></script>
</body>
</html>
