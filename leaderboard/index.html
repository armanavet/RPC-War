<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — Oddboard</title>
<meta name="description" content="Top rated players on Oddboard.">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/leaderboard.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="../">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--surface-2)" stroke="var(--line-2)" stroke-width="1.3"/>
        <circle cx="9.5" cy="10" r="4.6" fill="var(--accent)"/>
        <circle cx="15" cy="14.5" r="4.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.3"/>
      </svg>
      <span class="brand__name">Oddboard</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="../">Games</a>
      <a href="./" aria-current="page">Leaderboard</a>
    </nav>
    <div class="topbar__end">
      <button class="chipbtn" id="navProfile">
        <span class="avatar avatar--sm" id="navAvatar"></span>
        <span id="navName">Sign in</span>
      </button>
    </div>
  </div>
</header>

<main class="stack">
  <div class="wrap">
    <div class="lb__hd">
      <h1 class="h-games display">Leaderboard</h1>
      <select class="field lb__pick" id="lbGame" aria-label="Game"></select>
    </div>

    <div class="panel">
      <table class="lb" id="lbTable">
        <thead>
          <tr>
            <th class="lb__rank">#</th>
            <th>Player</th>
            <th class="lb__num">Rating</th>
            <th class="lb__num lb__wide">W</th>
            <th class="lb__num lb__wide">L</th>
            <th class="lb__num lb__wide">D</th>
          </tr>
        </thead>
        <tbody id="lbBody"></tbody>
      </table>
      <p class="lb__empty" id="lbEmpty" style="display:none">No rated games yet.</p>
    </div>

    <p class="lb__note">
      Only ranked games count. Games from an invite link are friendly and do not
      affect rating.
    </p>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <a href="../">Oddboard</a>
    <span class="muted">Ratings start at 1200.</span>
  </div>
</footer>

<script type="module" src="../js/site/leaderboard.js"></script>
</body>
</html>
