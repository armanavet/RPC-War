<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oddboards — board games for two</title>
<meta name="description" content="Board games for two. Play the computer, or send a friend a link.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/ads.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="./">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="var(--surface-2)" stroke="var(--line-2)" stroke-width="1.3"/>
        <circle cx="9.5" cy="10" r="4.6" fill="var(--accent)"/>
        <circle cx="15" cy="14.5" r="4.6" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.3"/>
      </svg>
      <span class="brand__name">Oddboards</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a href="./" aria-current="page">Games</a>
      <a href="leaderboard/">Leaderboard</a>
    </nav>

    <div class="topbar__end">
      <button class="chipbtn" id="navProfile">
        <span class="avatar avatar--sm" id="navAvatar">?</span>
        <span id="navName">Guest</span>
      </button>
    </div>
  </div>
</header>

<main class="stack">
  <div class="wrap">

    <section class="me panel" id="profile">
      <span class="avatar avatar--lg" id="profileAvatar">?</span>
      <div class="me__who">
        <div class="me__name display" id="profileName">Guest</div>
        <div class="me__line muted tnum" id="profileStats"></div>
      </div>
      <button class="btn btn--sm btn--ghost" id="btnEditName">Change name</button>
    </section>

    <div class="games-hd">
      <h1 class="h-games display">Games</h1>
      <span class="live live--total" id="liveTotal" hidden></span>
    </div>
    <div class="grid" id="gameGrid"></div>

    <div class="adslot" data-ad="home"></div>

  </div>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <span>Oddboards</span>
    <a href="https://github.com/armanavet/RPC-War">Source</a>
      <a href="privacy/">Privacy</a>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="modal__box">
    <div class="modal__title" id="modalTitle">Your name</div>
    <div class="modal__sub" id="modalSub">This is what your opponent sees.</div>
    <input class="field" id="nameIn" maxlength="16" placeholder="Your name" autocomplete="off">
    <div class="modal__btns">
      <button class="btn btn--primary" id="modalOk">Save</button>
      <button class="btn btn--ghost" id="modalCancel">Cancel</button>
    </div>
    <div class="err" id="modalErr" style="display:none"></div>
  </div>
</div>

<script type="module" src="js/site/home.js"></script>
</body>
</html>
